name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      RAILS_ENV: test
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGPORT: 5432
      SECRET_KEY_BASE: test_secret_key_base_for_ci
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ci_test_primary_key_for_encryption_32b
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ci_test_deterministic_key_for_enc
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ci_test_key_derivation_salt_value
      CI: true
      PARALLEL_TEST_PROCESSORS: 4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.7'
          bundler-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev build-essential libvips libvips-dev

      - name: Setup parallel test databases
        run: |
          bundle exec rake parallel:create
          bundle exec rake parallel:load_schema

      - name: Run tests in parallel
        run: bundle exec parallel_rspec spec/ -n $PARALLEL_TEST_PROCESSORS

      - name: Generate Swagger documentation
        run: bundle exec rake rswag:specs:swaggerize
        continue-on-error: true

      - name: Upload Swagger docs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: swagger-docs
          path: swagger/v1/swagger.yaml
          if-no-files-found: ignore
