x-rails-env: &rails-env
  RAILS_ENV: staging
  RAILS_SERVE_STATIC_FILES: "1"
  RAILS_LOG_TO_STDOUT: "1"
  RAILS_MAX_THREADS: "5"
  REDIS_URL: "redis://redis-staging:6379/1"
  RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
  SECRET_KEY_BASE: ${SECRET_KEY_BASE}
  DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres-db-staging:5432/eventz_flow_api_staging}
  # Mail configuration
  RESEND_API_KEY: ${RESEND_API_KEY}
  REDIRECT_BASE_URL: ${REDIRECT_BASE_URL}

x-db-env: &db-env
  POSTGRES_DB: eventz_flow_api_staging
  POSTGRES_USER: ${DATABASE_USER:-postgres}
  POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}

services:
  web:
    build: .
    image: eventz-flow-backend-staging:latest
    depends_on:
      postgres-db-staging:
        condition: service_healthy
      redis-staging:
        condition: service_healthy
    environment:
      <<: *rails-env
    ports:
      - "3000"
    volumes:
      - app-storage:/rails/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_signal: SIGTERM
    stop_grace_period: 30s
    networks:
      - coolify

  sidekiq:
    image: eventz-flow-backend-staging:latest
    command: bundle exec sidekiq
    depends_on:
      postgres-db-staging:
        condition: service_healthy
      redis-staging:
        condition: service_healthy
    environment:
      <<: *rails-env
    volumes:
      - app-storage:/rails/storage
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_signal: SIGTERM
    stop_grace_period: 30s
    networks:
      - coolify

  postgres-db-staging:
    image: pgvector/pgvector:pg18-trixie
    environment:
      <<: *db-env
    volumes:
      - pg-staging-data:/var/lib/postgresql
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d eventz_flow_api_staging -U $${POSTGRES_USER} -h localhost -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - coolify

  redis-staging:
    image: redis:7-alpine
    volumes:
      - redis-staging-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - coolify

volumes:
  pg-staging-data:
  app-storage:
  redis-staging-data:

networks:
  coolify:
    external: true
