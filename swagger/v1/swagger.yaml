---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/v1/events":
    post:
      summary: Creates a new event (ORG_OWNER or MANAGER ONLY)
      tags:
      - Events
      security:
      - BearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer JWT or Raw API Key
        schema:
          type: string
      responses:
        '201':
          description: Event created by Org Owner or Manager (API Key)
        '403':
          description: Forbidden (Not Org Owner or Manager)
        '401':
          description: Unauthorized (Missing Token)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                price:
                  type: number
                  format: float
                start_date:
                  type: string
                  format: date_time
                end_date:
                  type: string
                  format: date_time
              required:
              - title
    get:
      summary: Lists events managed or staffed by the user
      tags:
      - Events
      security:
      - BearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer JWT or Raw API Key
        schema:
          type: string
      responses:
        '200':
          description: Empty list for member user
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    title:
                      type: string
                    payment_status:
                      type: string
  "/v1/events/{id}":
    parameters:
    - name: id
      in: path
      description: Event ID
      required: true
      schema:
        type: integer
    get:
      summary: Retrieves a specific event
      tags:
      - Events
      security:
      - BearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer JWT or Raw API Key
        schema:
          type: string
      responses:
        '200':
          description: Event found (API Key)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  title:
                    type: string
                    example: Paid Event
                  description:
                    type: string
                    example: Event description.
                  status:
                    type: string
                    example: draft
                  multiple_scans:
                    type: boolean
                    example: false
                  start_date:
                    type: string
                    format: date_time
                  end_date:
                    type: string
                    format: date_time
                  location:
                    type: string
                    example: New York City
                  webhook_url:
                    type: string
                    nullable: true
                  labels_data:
                    type: object
                  payment_status:
                    type: string
                    example: paid
                  price:
                    type: string
                    example: '100.0'
                required:
                - id
                - title
                - status
                - start_date
                - end_date
                - payment_status
                - price
        '404':
          description: Event not found
    put:
      summary: Updates event details
      tags:
      - Events
      security:
      - BearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer JWT or Raw API Key
        schema:
          type: string
      responses:
        '200':
          description: Update successful (Manager & Paid - API Key)
        '403':
          description: Forbidden (Member user)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: New Title
    delete:
      summary: Deletes/Archives the event
      tags:
      - Events
      security:
      - BearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer JWT or Raw API Key
        schema:
          type: string
      responses:
        '204':
          description: Deletion successful (API Key)
        '403':
          description: Forbidden (Member user)
  "/v1/login":
    post:
      summary: Authenticates user and retrieves JWT token
      tags:
      - Authentication
      parameters: []
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      email:
                        type: string
                      role:
                        type: string
                        enum:
                        - org_owner
                        - manager
                        - member
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
                  message:
                    type: string
                    example: Invalid email or password
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: member@example.com
                password:
                  type: string
                  example: password123
              required:
              - email
              - password
  "/v1/refresh":
    post:
      summary: Refreshes JWT access token using the Refresh Token cookie
      tags:
      - Authentication
      responses:
        '200':
          description: New access token generated successfully
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refresh_token=NEW_TOKEN_HASH; HttpOnly; Secure; SameSite=Strict
              description: Sets a new secure HttpOnly Refresh Token cookie
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: The new, short-lived JWT Access Token
                required:
                - access_token
        '401':
          description: Unauthorized (Invalid or missing Refresh Token)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
                  message:
                    type: string
                    example: Refresh token is invalid or expired.
  "/v1/logout":
    delete:
      summary: Logs out the user by deleting the Refresh Token cookie
      tags:
      - Authentication
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer JWT Access Token for user identification.
        schema:
          type: string
      responses:
        '204':
          description: Logout successful (No Content)
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refresh_token=; expires=Thu, 01 Jan 1970 00:00:00 GMT; HttpOnly;
                  Secure; SameSite=Strict
              description: Deletes the Refresh Token cookie by setting an expiration
                date in the past.
  "/v1/events/{event_id}/tickets":
    parameters:
    - name: event_id
      in: path
      description: ID of the parent Event
      required: true
      schema:
        type: integer
    get:
      summary: Lists all tickets for a specific event
      tags:
      - Tickets
      security:
      - BearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Returns list of tickets for authorized staff
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    public_id:
                      type: string
                      format: uuid
                    attendee_name:
                      type: string
                    status:
                      type: string
                      enum:
                      - purchased
                      - scanned
                      - refunded
                      - canceled
        '403':
          description: Forbidden for unauthorized member user
    post:
      summary: Creates a new ticket (Staff Manual Entry)
      tags:
      - Tickets
      security:
      - BearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Ticket created by Manager
        '403':
          description: Forbidden for event staff (Team Member)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ticket:
                  type: object
                  properties:
                    attendee_name:
                      type: string
                    attendee_email:
                      type: string
                      format: email
                    ticket_type_id:
                      type: integer
                    custom_fields_data:
                      type: object
                  required:
                  - attendee_name
                  - attendee_email
              required:
              - ticket
  "/v1/events/{event_id}/tickets/{id}":
    parameters:
    - name: event_id
      in: path
      required: true
      schema:
        type: integer
    - name: id
      in: path
      description: Ticket Public ID (UUID)
      required: true
      schema:
        type: string
    get:
      summary: Retrieves a specific ticket
      tags:
      - Tickets
      security:
      - BearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Ticket found and viewable by staff
        '403':
          description: Not found by member user
    patch:
      summary: Updates a specific ticket
      tags:
      - Tickets
      security:
      - BearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Ticket successfully updated by staff
        '403':
          description: Forbidden for unauthorized user
        '404':
          description: Not Found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ticket:
                  type: object
                  properties:
                    attendee_name:
                      type: string
                    attendee_email:
                      type: string
                      format: email
    delete:
      summary: Cancels/Deletes a ticket (Soft Delete)
      tags:
      - Tickets
      security:
      - BearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Ticket successfully canceled by Manager
        '403':
          description: Forbidden for event staff
        '404':
          description: Not Found
  "/v1/tickets/{public_id}/check_in":
    parameters:
    - name: public_id
      in: path
      description: Ticket Public ID (UUID)
      required: true
      schema:
        type: string
    patch:
      summary: Performs a global check-in using only the Ticket Public ID
      tags:
      - Tickets
      security:
      - BearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Check-in successful via global scan by staff
        '422':
          description: Already checked in
        '403':
          description: Forbidden for unauthorized user (member or staff of another
            event)
        '404':
          description: Not Found
  "/v1/users":
    post:
      summary: Registers a new user (Member role)
      tags:
      - User Management
      parameters: []
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      email:
                        type: string
                      full_name:
                        type: string
                      role:
                        type: string
        '422':
          description: Validation error
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: new_user@test.com
                password:
                  type: string
                  example: securepass
                password_confirmation:
                  type: string
                  example: securepass
                full_name:
                  type: string
                  example: Jane Doe
              required:
              - email
              - password
              - password_confirmation
              - full_name
  "/v1/users/profile":
    get:
      summary: Retrieves the authenticated user's profile
      tags:
      - User Management
      security:
      - BearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer JWT
        schema:
          type: string
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  email:
                    type: string
                    format: email
                  full_name:
                    type: string
                    nullable: true
                  phone:
                    type: string
                    nullable: true
                required:
                - id
                - email
        '401':
          description: Unauthorized (Missing JWT)
    put:
      summary: Updates the authenticated user's profile
      tags:
      - User Management
      security:
      - BearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer JWT
        schema:
          type: string
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  email:
                    type: string
                    format: email
                  full_name:
                    type: string
                    nullable: true
                  phone:
                    type: string
                    nullable: true
                required:
                - id
                - email
        '422':
          description: Validation error
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                  example: Updated Name
                phone:
                  type: string
                  example: '1234567890'
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: www.example.com
