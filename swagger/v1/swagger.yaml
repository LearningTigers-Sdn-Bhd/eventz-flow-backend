  "/v1/imports/tickets":
    post:
      summary: Import tickets from Excel file
      tags:
      - Imports
      security:
      - BearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      - name: dry_run
        in: query
        required: false
        description: If true, validate and report without writing changes
        schema:
          type: boolean
      - name: full
        in: query
        required: false
        description: If true, use full import mode with additional validation and
          processing
        schema:
          type: boolean
      - name: no_label
        in: query
        required: false
        description: When true, use sequential Label N keys; when false, use header
          names as keys
        schema:
          type: boolean
      responses:
        '200':
          description: Allows same phone/email when names differ (business rule)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                        description: Total number of tickets processed
                      created:
                        type: object
                        properties:
                          count:
                            type: integer
                            description: Number of tickets created
                          data:
                            type: array
                            items:
                              type: object
                            description: Array of created ticket data
                      updated:
                        type: object
                        properties:
                          count:
                            type: integer
                            description: Number of tickets updated (more complete
                              rows or data changes)
                          data:
                            type: array
                            items:
                              type: object
                              properties:
                                model:
                                  type: string
                                id:
                                  type: string
                                changed_fields:
                                  type: array
                                  items:
                                    type: string
                                  description: Array of field names that changed (e.g.,
                                    ["payment_status", "custom_fields_data"])
                            description: Array of updated ticket data with changed_fields
                              tracking
                        description: Present only when tickets were updated
                      skipped:
                        type: object
                        properties:
                          count:
                            type: integer
                            description: Number of tickets skipped (duplicates)
                          data:
                            type: array
                            items:
                              type: object
                            description: Array of skipped ticket data
                      duplicates_in_file:
                        type: object
                        properties:
                          count:
                            type: integer
                            description: Number of duplicate rows collapsed within
                              the file
                          data:
                            type: array
                            items:
                              type: object
                            description: Array of duplicate ticket data
                        description: Present only when duplicates were found in the
                          file
                      errors:
                        type: object
                        properties:
                          count:
                            type: integer
                            description: Number of errors encountered
                          data:
                            type: array
                            items:
                              type: string
                            description: Array of error messages
                    required:
                    - total
                    - created
                    - skipped
                    - errors
        '401':
          description: Unauthorized - Missing or invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '422':
          description: Unprocessable Entity - No file provided or import failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: file
        required: true
        description: Excel file (.xlsx) with ticket data
