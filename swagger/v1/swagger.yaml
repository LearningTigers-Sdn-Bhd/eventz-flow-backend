                  payment_method:
                    type:
                    - string
                    - 'null'
                    description: Payment method used (e.g., credit_card, bank_transfer)
                  checked_in:
                    type: boolean
                    readOnly: true
                  custom_fields_data:
                    type: object
                    description: 'E.g., {"t_shirt_size": "L"}'
                  event_id:
                    type: integer
                    readOnly: true
                  ticket_type_id:
                    type: integer
                  ticket_type:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      price:
                        type: string
                        description: Price as decimal string
                required:
                - public_id
                - attendee_name
                - attendee_email
                - status
                - payment_status
                - event_id
                - ticket_type_id
                additionalProperties: true
        '422':
          description: Already checked in
        '403':
          description: Forbidden for unauthorized user (member or staff of another
            event)
        '404':
          description: Not Found
  "/v1/users/{id}/role":
    put:
      summary: Updates a global user's role
      tags:
      - User Management
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: Authorization
        in: header
        required: true
        description: Bearer JWT
        schema:
          type: string
      responses:
        '200':
          description: Role updated successfully
        '403':
          description: Forbidden
        '422':
          description: Validation Error
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    role:
                      type: string
                      enum:
                      - org_owner
                      - manager
                      - member
                      example: manager
                  required:
                  - role
              required:
              - user
        required: true
  "/v1/users":
    post:
      summary: Registers a new user (Member role)
      tags:
      - User Management
      parameters: []
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: JWT token for immediate authentication.
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      email:
                        type: string
                        format: email
                      full_name:
                        type: string
                        nullable: true
                      phone:
                        type: string
                        nullable: true
                      role:
                        type: string
                        description: The assigned user role (e.g., member).
                    required:
                    - id
                    - email
                    - role
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: General error message for 401, 403, 404.
                  errors:
                    type: array
                    description: Validation errors (for 422 responses).
                    additionalProperties:
                      type: array
                      items:
                        type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: new_user@test.com
                password:
                  type: string
                  example: securepass
                password_confirmation:
                  type: string
                  example: securepass
                full_name:
                  type: string
                  example: Jane Doe
              required:
              - email
              - password
              - password_confirmation
              - full_name
  "/v1/users/profile":
    get:
      summary: Retrieves the authenticated user's profile
      tags:
      - User Management
      security:
      - BearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer JWT
        schema:
          type: string
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  email:
                    type: string
                    format: email
                  full_name:
                    type: string
                    nullable: true
                  phone:
                    type: string
                    nullable: true
                required:
                - id
                - email
        '401':
          description: Unauthorized (Missing JWT)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: General error message for 401, 403, 404.
                  errors:
                    type: array
                    description: Validation errors (for 422 responses).
                    additionalProperties:
                      type: array
                      items:
                        type: string
    put:
      summary: Updates the authenticated user's profile
      tags:
      - User Management
      security:
      - BearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer JWT
        schema:
          type: string
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  email:
                    type: string
                    format: email
                  full_name:
                    type: string
                    nullable: true
                  phone:
                    type: string
                    nullable: true
                required:
                - id
                - email
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: General error message for 401, 403, 404.
                  errors:
                    type: array
                    description: Validation errors (for 422 responses).
                    additionalProperties:
                      type: array
                      items:
                        type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                  example: Updated Name
                phone:
                  type: string
                  example: '1234567890'
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: www.example.com
