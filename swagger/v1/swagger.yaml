---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/v1/metrics/events_overview":
    get:
      summary: Get all accessible events with their analytics data
      tags:
      - Optimized Analytics
      parameters:
      - name: Authorization
        in: header
        description: Bearer token
        schema:
          type: string
      responses:
        '200':
          description: Events overview retrieved successfully for staff (scoped to
            assigned events)
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        title:
                          type: string
                        status:
                          type: string
                        total_tickets:
                          type: integer
                          description: Total active tickets (purchased + scanned)
                        scanned_tickets:
                          type: integer
                          description: Total checked-in tickets
                        unscanned_tickets:
                          type: integer
                          description: Total unscanned active tickets
                        total_revenue:
                          type: integer
                          description: Total revenue in cents
                        last_activity:
                          type: string
                          format: date-time
        '401':
          description: Unauthorized
  "/v1/metrics/summary":
    get:
      summary: Get aggregated analytics summary across all accessible events
      tags:
      - Optimized Analytics
      parameters:
      - name: Authorization
        in: header
        description: Bearer token
        schema:
          type: string
      responses:
        '200':
          description: Analytics summary retrieved successfully for staff (scoped
            to assigned events)
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_events:
                    type: integer
                    description: Total number of accessible events
                  active_events:
                    type: integer
                    description: Number of published events
                  total_tickets:
                    type: integer
                    description: Total active tickets (purchased + scanned)
                  total_scanned:
                    type: integer
                    description: Total checked-in tickets
                  total_revenue:
                    type: integer
                    description: Total revenue in cents
                  total_locations:
                    type: integer
                    description: Total event locations
        '401':
          description: Unauthorized
  "/v1/metrics/total_tickets":
    get:
      summary: Get total tickets count across all accessible events
      tags:
      - Global Analytics
      parameters:
      - name: Authorization
        in: header
        description: Bearer token
        schema:
          type: string
      responses:
        '200':
          description: Total tickets retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalTickets:
                    type: integer
                    description: Total number of active tickets across all events
        '403':
          description: Forbidden - insufficient permissions
        '401':
          description: Unauthorized
  "/v1/metrics/total_scanned_tickets":
    get:
      summary: Get total scanned tickets count across all accessible events
      tags:
      - Global Analytics
      parameters:
      - name: Authorization
        in: header
        description: Bearer token
        schema:
          type: string
      responses:
        '200':
          description: Total scanned tickets retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalScannedTickets:
                    type: integer
                    description: Total number of scanned tickets across all events
  "/v1/metrics/total_unscanned_tickets":
    get:
      summary: Get total unscanned tickets count across all accessible events
      tags:
      - Global Analytics
      parameters:
      - name: Authorization
        in: header
        description: Bearer token
        schema:
          type: string
      responses:
        '200':
          description: Total unscanned tickets retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalUnscannedTickets:
                    type: integer
                    description: Total number of unscanned tickets across all events
  "/v1/metrics/total_amount_price":
    get:
      summary: Get total sales amount across all accessible events
      tags:
      - Global Analytics
      parameters:
      - name: Authorization
        in: header
        description: Bearer token
        schema:
          type: string
      responses:
        '200':
          description: Total sales amount retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalAmountPrice:
                    type: integer
                    description: Total sales amount in cents across all events
  "/v1/metrics/weekly_registered":
    get:
      summary: Get weekly registered tickets data across all accessible events
      tags:
      - Global Analytics
      parameters:
      - name: Authorization
        in: header
        description: Bearer token
        schema:
          type: string
      responses:
        '200':
          description: Weekly registered tickets retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  weeklyRegisteredTickets:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                          description: Date in YYYY-MM-DD format
                        count:
                          type: integer
                          description: Number of tickets registered on this date
  "/v1/metrics/weekly_scanned":
    get:
      summary: Get weekly scanned tickets data across all accessible events
      tags:
      - Global Analytics
      parameters:
      - name: Authorization
        in: header
        description: Bearer token
        schema:
          type: string
      responses:
        '200':
          description: Weekly scanned tickets retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  weeklyScannedTickets:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                          description: Date in YYYY-MM-DD format
                        count:
                          type: integer
                          description: Number of tickets scanned on this date
  "/v1/metrics/weekly_sales_amount":
    get:
      summary: Get weekly sales amount data across all accessible events
      tags:
      - Global Analytics
      parameters:
      - name: Authorization
        in: header
        description: Bearer token
        schema:
          type: string
      responses:
        '200':
          description: Weekly sales amount retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  weeklySalesAmount:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                          description: Date in YYYY-MM-DD format
                        count:
                          type: integer
                          description: Sales amount in cents for this date
  "/v1/api_keys":
    get:
      summary: Lists all API keys for the authenticated user
      tags:
      - API Keys
      security:
      - BearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer JWT token
        schema:
          type: string
      responses:
        '200':
          description: API keys retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                      nullable: true
                    last_used_at:
                      type: string
                      format: date_time
                      nullable: true
                    created_at:
                      type: string
                      format: date_time
                  required:
                  - id
                  - created_at
        '403':
          description: Forbidden (Member cannot access)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                required:
                - error
        '401':
          description: Unauthorized (Invalid token)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Success flag
                  message:
                    type: string
                    description: Error message
                  errors:
                    type: array
                    description: Error details
                required:
                - success
                - message
                - errors
    post:
      summary: Creates a new API key for the authenticated user
      tags:
      - API Keys
      security:
      - BearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer JWT token
        schema:
          type: string
      responses:
        '201':
          description: API key created successfully without name
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                    nullable: true
                  raw_key:
                    type: string
                    description: The raw API key - save this securely, it will not
                      be shown again
                  message:
                    type: string
                required:
                - id
                - raw_key
                - message
        '422':
          description: Unprocessable Entity (Name too long)
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    description: Validation errors
                    items:
                      type: string
                required:
                - errors
        '403':
          description: Forbidden (Member cannot create API keys)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                required:
                - error
        '401':
          description: Unauthorized (Empty token)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Success flag
                  message:
                    type: string
                    description: Error message
                  errors:
                    type: array
                    description: Error details
                required:
                - success
                - message
                - errors
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: My Production API Key
                  description: 'Optional: A descriptive name for the API key'
  "/v1/api_keys/{id}":
    parameters:
    - name: id
      in: path
      description: API Key ID
      required: true
      schema:
        type: integer
    delete:
      summary: Revokes (deactivates) an API key
      tags:
      - API Keys
      security:
      - BearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer JWT token
        schema:
          type: string
      responses:
        '204':
          description: API key revoked successfully
        '404':
          description: Not Found (Member cannot access org_owner key)
        '403':
          description: Forbidden (Only org_owner can revoke API keys)
        '401':
          description: Unauthorized (Empty token)
  "/v1/auth/password":
    patch:
      summary: Update password for authenticated user
      tags:
      - Auth
      security:
      - BearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        description: Bearer JWT token
      responses:
        '200':
          description: Password updated successfully
        '401':
          description: Current password incorrect
        '422':
          description: Validation error (password mismatch)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                  example: OldPass123!
                new_password:
                  type: string
                  example: NewPass123!
                confirm_new_password:
                  type: string
                  example: NewPass123!
              required:
              - current_password
              - new_password
              - confirm_new_password
