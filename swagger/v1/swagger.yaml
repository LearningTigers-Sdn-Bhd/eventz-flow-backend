  "/v1/events/{event_id}/event_locations":
    parameters:
    - name: event_id
      in: path
      description: Event ID
      required: true
      schema:
        type: integer
    get:
      summary: Lists all event locations for an event
      tags:
      - Event Locations
      security:
      - BearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer JWT or Raw API Key
        schema:
          type: string
      responses:
        '200':
          description: Event locations returned via API Key
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    event_id:
                      type: integer
                      example: 1
                    name:
                      type: string
                      example: Main Hall
                    scan_limit:
                      type: integer
                      example: 100
                    is_unlimited:
                      type: boolean
                      default: false
                    created_at:
                      type: string
                      format: date_time
                    updated_at:
                      type: string
                      format: date_time
                    members:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                          full_name:
                            type: string
                          email:
                            type: string
                  required:
                  - id
                  - event_id
                  - name
        '403':
          description: Forbidden (Not authorized to view event)
        '401':
          description: Unauthorized (Missing Token)
        '404':
          description: Event not found
    post:
      summary: Creates a new event location
      tags:
      - Event Locations
      security:
      - BearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer JWT or Raw API Key
        schema:
          type: string
      responses:
        '201':
          description: Event location created by API Key
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  event_id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: Main Hall
                  scan_limit:
                    type: integer
                    example: 100
                  is_unlimited:
                    type: boolean
                    default: false
                  created_at:
                    type: string
                    format: date_time
                  updated_at:
                    type: string
                    format: date_time
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        full_name:
                          type: string
                        email:
                          type: string
                required:
                - id
                - event_id
                - name
        '422':
          description: Unprocessable Entity (Duplicate location name)
        '403':
          description: Forbidden (Not authorized to create locations)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Main Stage
                scan_limit:
                  type: integer
                  example: 200
                is_unlimited:
                  type: boolean
                  default: false
                member_ids:
                  type: array
                  items:
                    type: integer
                  example:
                  - 1
                  - 2
                  - 3
                  description: 'Optional: Array of user IDs to assign as location
                    members'
              required:
              - name
  "/v1/events/{event_id}/event_locations/{id}":
    parameters:
    - name: event_id
      in: path
      description: Event ID
      required: true
      schema:
        type: integer
    - name: id
      in: path
      description: Event Location ID
      required: true
      schema:
