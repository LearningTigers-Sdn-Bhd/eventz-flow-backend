---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/v1/auth/password/request_reset_password":
    post:
      summary: Request a password reset email
      tags:
      - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
      responses:
        '200':
          description: Instructions sent (generic)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
  "/v1/auth/password/verify_reset_password_request":
    get:
      summary: Verify reset password token validity
      tags:
      - Authentication
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Token is valid
        '422':
          description: Invalid or expired token
  "/v1/auth/password/reset_password":
    post:
      summary: Reset password using token
      tags:
      - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                password:
                  type: string
                password_confirmation:
                  type: string
      responses:
        '200':
          description: Password has been reset
        '422':
          description: Validation error
  "/v1/analytics/events_overview":
    get:
      summary: Get all accessible events with their analytics data
      tags:
      - Optimized Analytics
      parameters:
      - name: Authorization
        in: header
        description: Bearer token
        schema:
          type: string
      responses:
        '200':
          description: Events overview retrieved successfully for staff (scoped to
            assigned events)
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        title:
                          type: string
                        status:
                          type: string
                        total_tickets:
                          type: integer
                          description: Total active tickets (purchased + scanned)
                        scanned_tickets:
                          type: integer
                          description: Total checked-in tickets
                        unscanned_tickets:
                          type: integer
                          description: Total unscanned active tickets
                        total_revenue:
                          type: integer
                          description: Total revenue in cents
                        last_activity:
                          type: string
                          format: date-time
        '401':
          description: Unauthorized
  "/v1/analytics/summary":
    get:
      summary: Get aggregated analytics summary across all accessible events
      tags:
      - Optimized Analytics
      parameters:
      - name: Authorization
        in: header
        description: Bearer token
        schema:
          type: string
      responses:
        '200':
          description: Analytics summary retrieved successfully for staff (scoped
            to assigned events)
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_events:
                    type: integer
                    description: Total number of accessible events
                  active_events:
                    type: integer
                    description: Number of published events
                  total_tickets:
                    type: integer
                    description: Total active tickets (purchased + scanned)
                  total_scanned:
                    type: integer
                    description: Total checked-in tickets
                  total_revenue:
                    type: integer
                    description: Total revenue in cents
                  total_locations:
                    type: integer
                    description: Total event locations
        '401':
          description: Unauthorized
  "/v1/analytics/total_tickets":
    get:
      summary: Get total tickets count across all accessible events
      tags:
      - Global Analytics
      parameters:
      - name: Authorization
        in: header
        description: Bearer token
        schema:
          type: string
      responses:
        '200':
          description: Total tickets retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalTickets:
                    type: integer
                    description: Total number of active tickets across all events
        '403':
          description: Forbidden - insufficient permissions
        '401':
          description: Unauthorized
  "/v1/analytics/total_scanned_tickets":
    get:
      summary: Get total scanned tickets count across all accessible events
      tags:
      - Global Analytics
      parameters:
      - name: Authorization
        in: header
        description: Bearer token
        schema:
          type: string
      responses:
        '200':
          description: Total scanned tickets retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalScannedTickets:
                    type: integer
                    description: Total number of scanned tickets across all events
  "/v1/analytics/total_unscanned_tickets":
    get:
      summary: Get total unscanned tickets count across all accessible events
      tags:
      - Global Analytics
      parameters:
      - name: Authorization
        in: header
        description: Bearer token
        schema:
          type: string
      responses:
        '200':
          description: Total unscanned tickets retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalUnscannedTickets:
                    type: integer
                    description: Total number of unscanned tickets across all events
  "/v1/analytics/total_amount_price":
    get:
      summary: Get total sales amount across all accessible events
      tags:
      - Global Analytics
      parameters:
      - name: Authorization
        in: header
        description: Bearer token
        schema:
          type: string
      responses:
        '200':
          description: Total sales amount retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalAmountPrice:
                    type: integer
                    description: Total sales amount in cents across all events
  "/v1/analytics/weekly_registered_tickets":
    get:
      summary: Get weekly registered tickets data across all accessible events
      tags:
      - Global Analytics
      parameters:
      - name: Authorization
        in: header
        description: Bearer token
        schema:
          type: string
      responses:
        '200':
          description: Weekly registered tickets retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  weeklyRegisteredTickets:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                          description: Date in YYYY-MM-DD format
                        count:
                          type: integer
                          description: Number of tickets registered on this date
  "/v1/analytics/weekly_scanned_tickets":
    get:
      summary: Get weekly scanned tickets data across all accessible events
      tags:
      - Global Analytics
      parameters:
      - name: Authorization
        in: header
        description: Bearer token
        schema:
          type: string
      responses:
        '200':
          description: Weekly scanned tickets retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  weeklyScannedTickets:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                          description: Date in YYYY-MM-DD format
                        count:
                          type: integer
                          description: Number of tickets scanned on this date
  "/v1/analytics/weekly_sales_amount":
    get:
      summary: Get weekly sales amount data across all accessible events
      tags:
      - Global Analytics
      parameters:
      - name: Authorization
        in: header
        description: Bearer token
        schema:
          type: string
      responses:
        '200':
          description: Weekly sales amount retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  weeklySalesAmount:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                          description: Date in YYYY-MM-DD format
                        count:
                          type: integer
                          description: Sales amount in cents for this date
  "/v1/api_keys":
    get:
      summary: Lists all API keys for the authenticated user
      tags:
      - API Keys
      security:
      - BearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer JWT token
        schema:
          type: string
      responses:
        '200':
          description: API keys retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                      nullable: true
                    last_used_at:
                      type: string
                      format: date_time
                      nullable: true
                    created_at:
                      type: string
                      format: date_time
                  required:
                  - id
                  - created_at
        '403':
          description: Forbidden (Member cannot access)
        '401':
          description: Unauthorized (Invalid token)
    post:
      summary: Creates a new API key for the authenticated user
      tags:
      - API Keys
      security:
      - BearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer JWT token
        schema:
          type: string
      responses:
        '201':
          description: API key created successfully without name
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  raw_key:
                    type: string
                    description: The raw API key - save this securely, it will not
                      be shown again
                  message:
                    type: string
                required:
                - id
                - raw_key
                - message
        '422':
          description: Unprocessable Entity (Name too long)
        '403':
          description: Forbidden (Member cannot create API keys)
        '401':
          description: Unauthorized (Empty token)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: My Production API Key
                  description: 'Optional: A descriptive name for the API key'
  "/v1/api_keys/{id}":
    parameters:
    - name: id
      in: path
      description: API Key ID
      required: true
      schema:
        type: integer
    delete:
      summary: Revokes (deactivates) an API key
      tags:
      - API Keys
      security:
      - BearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer JWT token
        schema:
          type: string
      responses:
        '204':
          description: API key revoked successfully
        '404':
          description: Not Found (Member cannot access org_owner key)
        '403':
          description: Forbidden (Only org_owner can revoke API keys)
        '401':
          description: Unauthorized (Empty token)
  "/v1/auth/register":
    post:
      summary: Registers a new user and retrieves JWT tokens
      tags:
      - Authentication
      parameters: []
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                      refresh_token:
                        type: string
                      expires_at:
                        type: string
                        format: date_time
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                          full_name:
                            type: string
                          email:
                            type: string
                          role:
                            type: string
                            enum:
                            - org_owner
                            - manager
                            - member
        '422':
          description: Duplicate email
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        message:
                          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      example: newuser@example.com
                    password:
                      type: string
                      example: password123
                    password_confirmation:
                      type: string
                      example: password123
                    full_name:
                      type: string
                      example: New User
                    phone:
                      type: string
                      example: "+1234567890"
                  required:
                  - email
                  - password
                  - password_confirmation
                  - full_name
              required:
              - user
  "/v1/auth/login":
    post:
      summary: Authenticates user and retrieves JWT tokens
      tags:
      - Authentication
      parameters: []
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                      refresh_token:
                        type: string
                      expires_at:
                        type: string
                        format: date_time
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                          full_name:
                            type: string
                          email:
                            type: string
                          role:
                            type: string
                            enum:
                            - org_owner
                            - manager
                            - member
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Authentication failed"
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                          enum:
                            - email
                            - password
                            - account
                        message:
                          type: string
                          enum:
                            - "Email not found"
                            - "Invalid password"
                            - "Account is inactive"
                    examples:
                      email_not_found:
                        summary: Email not found
                        value:
                          - field: "email"
                            message: "Email not found"
                      invalid_password:
                        summary: Invalid password
                        value:
                          - field: "password"
                            message: "Invalid password"
                      inactive_account:
                        summary: Account is inactive
                        value:
                          - field: "account"
                            message: "Account is inactive"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      example: member@example.com
                    password:
                      type: string
                      example: password123
                  required:
                  - email
                  - password
              required:
              - user
  "/v1/auth/logout":
    delete:
      summary: Logs out the user by revoking the JWT token
      tags:
      - Authentication
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Logout failed - User not found or not authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Logout failed"
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                          example: "user"
                        message:
                          type: string
                          example: "User not found or not authenticated"
  "/v1/auth/refresh_token":
    post:
      summary: Refreshes JWT access token using refresh token
      tags:
      - Authentication
      parameters: []
      responses:
        '200':
          description: Access token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                      refresh_token:
                        type: string
                      expires_at:
                        type: string
                        format: date_time
        '422':
          description: Missing refresh token
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        message:
                          type: string
        '401':
          description: Expired refresh token
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        message:
                          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  example: eyJhbGciOiJIUzI1NiJ9...
              required:
              - refresh_token
  "/v1/events/{event_id}/analytics/total_tickets":
    get:
      summary: Get total tickets count for an event
